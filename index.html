<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Night — Host Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage-glow"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">Live at</span>
      <h1 id="eventTitle" contenteditable="true" spellcheck="false">Friday Night Game Changer</h1>
    </div>
    <nav class="round-tabs" role="tablist">
      <button class="round-pill active" data-round="round1" type="button">
        <span class="round-pill-num">Round 1</span>
        <span class="round-pill-name">Trivia Board</span>
      </button>
      <button class="round-pill" data-round="round2" type="button">
        <span class="round-pill-num">Round 2</span>
        <span class="round-pill-name">Talent Show</span>
      </button>
      <button class="round-pill" data-round="round3" type="button">
        <span class="round-pill-num">Round 3</span>
        <span class="round-pill-name">Make Some Noise</span>
      </button>
      <button class="setup-btn" id="setupBtn" type="button">⚙ Setup</button>
    </nav>
  </header>

  <main class="layout">

    <section class="main-panel">

      <!-- ROUND 1: Jeopardy-style board -->
      <div class="view active" id="boardView">
        <div class="board-frame">
          <div class="board-grid" id="boardGrid"><!-- injected --></div>
        </div>
      </div>

      <!-- ROUNDS 2 & 3: Prompt console -->
      <div class="view" id="promptView">
        <div class="round-banner">
          <span class="brand-eyebrow">Now Running</span>
          <h2 id="roundBannerTitle">Round 2 · Talent Show</h2>
        </div>

        <div class="prompt-columns">

          <div class="prompt-main">
            <div class="prompt-display" id="promptDisplay">
              <span class="prompt-display-eyebrow">Prompt</span>
              <p id="promptDisplayText">Add prompts to the queue to get started&hellip;</p>
              <div class="prompt-meta">
                <div class="meta-item">
                  <span class="meta-label">On the spot</span>
                  <span class="meta-value" id="onTheSpotDisplay">—</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Judged by</span>
                  <span class="meta-value" id="judgedByDisplay">—</span>
                </div>
              </div>
            </div>

            <div class="queue-nav">
              <button id="prevPromptBtn" class="btn btn-ghost" type="button">← Prev</button>
              <span id="queuePosition" class="queue-position">0 / 0</span>
              <button id="nextPromptBtn" class="btn btn-gold" type="button">Next →</button>
            </div>
          </div>

          <div class="prompt-side">

            <div class="side-block">
              <label class="field-label" for="promptQueueInput">Add prompts (one per line)</label>
              <textarea id="promptQueueInput" rows="3" placeholder="A raccoon filing taxes&#10;The sound of regret"></textarea>
              <button id="addToQueueBtn" class="btn btn-gold btn-small" type="button">+ Add to queue</button>
              <ul class="queue-list" id="queueList"><!-- injected --></ul>
            </div>

            <div class="side-block">
              <label class="field-label" for="onTheSpotSelect">On the spot</label>
              <select id="onTheSpotSelect"><option value="">— none —</option></select>

              <label class="field-label" style="margin-top:12px;" for="judgedByInput">Judged by</label>
              <input id="judgedByInput" type="text" placeholder="e.g. the room votes" />
            </div>

            <div class="side-block">
              <label class="field-label">Timer</label>
              <div class="timer-display" id="timerDisplay">1:00</div>
              <div class="timer-controls">
                <input id="timerSecondsInput" type="number" value="60" min="5" step="5" title="Seconds" />
                <button id="timerStartBtn" class="btn btn-gold btn-small" type="button">Start</button>
                <button id="timerResetBtn" class="btn btn-ghost btn-small" type="button">Reset</button>
              </div>
            </div>

            <div class="side-block">
              <label class="field-label" for="awardAmount">Award points</label>
              <div class="award-row">
                <input id="awardAmount" type="number" value="100" />
                <button id="awardPointsBtn" class="btn btn-gold btn-small" type="button">Award to on-the-spot</button>
              </div>
            </div>

          </div>
        </div>
      </div>

    </section>

    <aside class="scoreboard">
      <div class="scoreboard-head">
        <h2>Scoreboard</h2>
      </div>
      <div class="add-contestant">
        <input id="newContestantName" type="text" placeholder="Add contestant…" />
        <button id="addContestantBtn" class="btn btn-gold btn-small" type="button">Add</button>
      </div>
      <ul class="contestant-list" id="contestantList"><!-- injected --></ul>
    </aside>

  </main>
</div>

<!-- Clue reveal overlay -->
<div class="overlay" id="clueOverlay">
  <div class="clue-card">
    <div class="clue-top">
      <span class="clue-category" id="clueCategory">Category</span>
      <span class="clue-value" id="clueValue">$200</span>
    </div>
    <div class="clue-body">
      <p class="clue-stage-label" id="clueStageLabel">Question</p>
      <p class="clue-text" id="clueText">Clue text goes here</p>
    </div>
    <div class="clue-actions">
      <button id="revealAnswerBtn" class="btn btn-gold" type="button">Reveal Answer</button>
      <button id="closeClueBtn" class="btn btn-ghost" type="button">Close &amp; Mark Done</button>
    </div>
  </div>
</div>

<!-- Setup overlay -->
<div class="overlay" id="setupOverlay">
  <div class="setup-card">
    <div class="setup-head">
      <h2>Board Setup</h2>
      <button id="closeSetupBtn" class="btn btn-ghost btn-small" type="button">Done</button>
    </div>

    <div class="setup-tools">
      <button id="fillValuesBtn" class="btn btn-ghost btn-small" type="button">Auto-fill values 100–500</button>
      <button id="exportBoardBtn" class="btn btn-ghost btn-small" type="button">Export board as file</button>
      <button id="importBoardBtn" class="btn btn-ghost btn-small" type="button">Import board from file</button>
      <input type="file" id="importBoardInput" accept="application/json" style="display:none" />
      <button id="resetUsedBtn" class="btn btn-danger btn-small" type="button">Mark all clues unused</button>
      <button id="resetBoardBtn" class="btn btn-danger btn-small" type="button">Reset entire board</button>
    </div>

    <div class="setup-categories" id="setupCategories"><!-- injected --></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
